name: Job Alert Bot

on:
  schedule:
    # Berjalan setiap 6 jam sekali (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      search_terms:
        description: 'Kata Kunci / Posisi (opsional, override config.json jika diisi)'
        required: false
        type: string
      locations:
        description: 'Lokasi (opsional, override config.json jika diisi)'
        required: false
        type: string
      filter_mode:
        description: 'Mode Filter Perusahaan (opsional, override config.json)'
        required: false
        type: choice
        options:
          - ''
          - highlight
          - only_top
          - all
      hours_old:
        description: 'Usia Lowongan dalam Jam (opsional)'
        required: false
        type: string
      results_wanted:
        description: 'Target Hasil per Query/Situs (opsional)'
        required: false
        type: string

# Permission contents: write dibutuhkan agar GitHub Actions bisa commit & push file seen_jobs.json
permissions:
  contents: write

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest test_smoke.py

      - name: Run Job Alert Script
        env:
          # Multi-channel webhooks (Stream routing)
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_TECH: ${{ secrets.DISCORD_WEBHOOK_TECH }}
          DISCORD_WEBHOOK_DATA: ${{ secrets.DISCORD_WEBHOOK_DATA }}
          DISCORD_WEBHOOK_PRODUCT: ${{ secrets.DISCORD_WEBHOOK_PRODUCT }}

          # AI Extractor (Opsional VPS)
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

          # Optional runtime overrides (bisa dikosongkan untuk memakai nilai config.json)
          SEARCH_TERMS: ${{ inputs.search_terms || vars.SEARCH_TERMS || '' }}
          LOCATIONS: ${{ inputs.locations || vars.LOCATIONS || '' }}
          FILTER_MODE: ${{ inputs.filter_mode || vars.FILTER_MODE || '' }}
          HOURS_OLD: ${{ inputs.hours_old || vars.HOURS_OLD || '' }}
          RESULTS_WANTED: ${{ inputs.results_wanted || vars.RESULTS_WANTED || '' }}
        run: |
          python main.py

      - name: Commit & push seen_jobs.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(bot): update seen_jobs.json [skip ci]'
          file_pattern: 'seen_jobs.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
